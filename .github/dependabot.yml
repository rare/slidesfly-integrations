version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /examples/marp
    schedule:
      interval: weekly
    groups:
      example-dependencies:
        patterns:
          - '*'

  - package-ecosystem: npm
    directory: /examples/revealjs
    schedule:
      interval: weekly
    groups:
      example-dependencies:
        patterns:
          - '*'

  - package-ecosystem: npm
    directory: /examples/slidev
    schedule:
      interval: weekly
    groups:
      example-dependencies:
        patterns:
          - '*'
