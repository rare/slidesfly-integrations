name: Publish action smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: deck
        uses: ./
        with:
          file: examples/plain-html/deck.html
          api-key: ${{ secrets.SLIDESFLY_API_KEY }}
          deck-id: hPTjZDoztFZRUFkbDzGbgz
      - name: Verify stable reader URL
        env:
          ACTUAL_URL: ${{ steps.deck.outputs.url }}
        run: test "$ACTUAL_URL" = "https://slidesfly.xyz/d/hPTjZDoztFZRUFkbDzGbgz"
