name: Validate integrations

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test publish action
        run: actions/publish/test.sh
      - name: Validate Marketplace entry point
        run: |
          test -f action.yml
          grep -q '^name: Publish HTML presentation to Slidesfly$' action.yml
          grep -q 'GITHUB_ACTION_PATH/actions/publish/publish.sh' action.yml
          grep -q 'uses: rare/slidesfly-integrations@v0.2.0' README.md
      - name: Validate Skill and MCP metadata
        run: |
          node -e "const fs=require('node:fs'); const skill=fs.readFileSync('skills/slidesfly/SKILL.md','utf8'); if(!skill.includes('name: slidesfly') || !skill.includes('version: 0.1.1')) process.exit(1)"
          node -e "JSON.parse(require('node:fs').readFileSync('mcp/server.json','utf8'))"
          node -e "JSON.parse(require('node:fs').readFileSync('mcp/server-card.json','utf8'))"
      - name: Build Reveal.js example
        working-directory: examples/revealjs
        run: npm ci && npm run build
      - name: Build Slidev example
        working-directory: examples/slidev
        run: npm ci && npm run build
      - name: Build Marp example
        working-directory: examples/marp
        run: npm ci && npm run build
