name: Validate integrations

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Verify workflow action pins
        run: node scripts/validate-workflow-pins.mjs
      - name: Validate OpenSSF readiness claim boundaries
        run: |
          test -f docs/openssf-best-practices.md
          grep -q 'No OpenSSF Best Practices badge has been earned yet' docs/openssf-best-practices.md
          grep -q 'Major new functionality must include or update automated tests' CONTRIBUTING.md
      - name: Test publish action
        run: actions/publish/test.sh
      - name: Validate Marketplace entry point
        run: |
          test -f action.yml
          grep -q '^name: Publish HTML presentation to Slidesfly$' action.yml
          grep -q 'GITHUB_ACTION_PATH/actions/publish/publish.sh' action.yml
          grep -q 'uses: rare/slidesfly-integrations@v0.3.1' README.md
          node -e "const fs=require('node:fs'); for (const file of ['action.yml','actions/publish/action.yml']) { const source=fs.readFileSync(file,'utf8'); if (!source.includes('SLIDESFLY_CLI_VERSION: 0.1.3') || !source.includes('SLIDESFLY_CLI_SHA256: cd94667fc714e998d87fd47e1ad94bd4d44e23a0b0f0fb70671df1a22365b699')) process.exit(1) }"
      - name: Validate Skill and MCP metadata
        run: |
          node -e "const fs=require('node:fs'); const skill=fs.readFileSync('skills/slidesfly/SKILL.md','utf8'); if(!skill.includes('name: slidesfly') || !skill.includes('version: 0.2.0')) process.exit(1)"
          test "$(node skills/slidesfly/scripts/slidesfly.mjs --version)" = "0.1.3"
          cmp skills/slidesfly/scripts/slidesfly.mjs claude/slidesfly/skills/slidesfly/scripts/slidesfly.mjs
          test "$(sha256sum skills/slidesfly/scripts/slidesfly.mjs | cut -d' ' -f1)" = "cd94667fc714e998d87fd47e1ad94bd4d44e23a0b0f0fb70671df1a22365b699"
          node -e "JSON.parse(require('node:fs').readFileSync('mcp/server.json','utf8'))"
          node -e "JSON.parse(require('node:fs').readFileSync('mcp/server-card.json','utf8'))"
      - name: Validate Claude Code plugin package
        run: node scripts/validate-claude-package.mjs
      - name: Validate Cursor Marketplace plugin package
        run: |
          node scripts/validate-cursor-plugin.mjs
          test "$(node cursor/slidesfly/skills/slidesfly/scripts/slidesfly.mjs --version)" = "0.1.3"
      - name: Validate Gemini CLI extension package
        run: |
          node scripts/validate-gemini-extension.mjs
          npx --yes @google/gemini-cli@0.53.0 extensions validate .
      - name: Verify public npm release checksums
        run: node scripts/verify-npm-release.mjs
      - name: Build Reveal.js example
        working-directory: examples/revealjs
        run: npm ci && npm audit --audit-level=moderate && npm run build
      - name: Test reader compatibility injector
        run: node --test examples/inject-slidesfly-reader-bridge.test.mjs
      - name: Build Slidev example
        working-directory: examples/slidev
        run: npm ci && npm audit --audit-level=moderate && npm run build
      - name: Build Marp example
        working-directory: examples/marp
        run: npm ci && npm audit --audit-level=moderate && npm run build
