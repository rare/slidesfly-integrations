name: Publish deck

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: deck
        uses: rare/slidesfly-integrations/actions/publish@af1afebb564fd2131cc8309b30c45c57784e6a0d # v0.3.0
        with:
          file: path/to/deck.html
          api-key: ${{ secrets.SLIDESFLY_API_KEY }}
          title: Workflow deck
          visibility: unlisted
      - name: Show reader URL
        env:
          SLIDESFLY_READER_URL: ${{ steps.deck.outputs.url }}
        run: echo "$SLIDESFLY_READER_URL"
