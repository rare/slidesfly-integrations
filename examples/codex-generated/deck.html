<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Codex to live deck · Slidesfly example</title>
    <link rel="icon" href="data:," />
    <style>
      :root {
        color-scheme: dark;
        font-family: ui-monospace, "SFMono-Regular", Menlo, monospace;
        background: #10120f;
        color: #edf4ed;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
      }
      main {
        display: grid;
        min-height: 100vh;
        place-items: center;
        padding: 8vw;
      }
      article {
        width: min(100%, 960px);
        padding: clamp(1.5rem, 5vw, 4rem);
        background: #171b16;
        border: 1px solid #2c3a2d;
        border-radius: 8px;
      }
      .label {
        color: #77d09e;
        font-size: 0.8rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
      h1 {
        max-width: 13ch;
        margin: 1rem 0 2rem;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        font-size: clamp(2.5rem, 7vw, 6rem);
        letter-spacing: -0.06em;
        line-height: 0.95;
      }
      ol {
        display: grid;
        gap: 1rem;
        padding-left: 1.5rem;
        color: #acb9ad;
        font: clamp(0.95rem, 2vw, 1.2rem) / 1.55 Inter, ui-sans-serif, system-ui, sans-serif;
      }
      code {
        color: #c5f3d7;
      }
    </style>
  </head>
  <body>
    <main>
      <article>
        <div class="label">Agent handoff</div>
        <h1>Codex made the artifact. Slidesfly publishes it.</h1>
        <ol>
          <li>Verify the HTML file on disk.</li>
          <li>Run <code>slidesfly publish ./deck.html --json</code>.</li>
          <li>Open the returned reader URL.</li>
          <li>Keep claim tokens and API keys out of chat.</li>
        </ol>
      </article>
    </main>
  </body>
</html>
